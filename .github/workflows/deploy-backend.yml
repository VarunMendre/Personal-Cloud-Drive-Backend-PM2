name: Deploy Backend Serverless

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📥 Install Dependencies
        working-directory: ./server
        run: npm i

      - name: ⚡ Install Serverless Framework
        run: npm install -g serverless@3.38.0

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: 🔍 Debug Env Vars
        working-directory: ./server
        env:
          DB_URL: ${{ secrets.DB_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          echo "Checking if environment variables are set..."
          [ -z "$DB_URL" ] && echo "DB_URL is MISSING" || echo "DB_URL is set"
          [ -z "$REDIS_HOST" ] && echo "REDIS_HOST is MISSING" || echo "REDIS_HOST is set"
          [ -z "$CLOUDFRONT_DOMAIN" ] && echo "CLOUDFRONT_DOMAIN is MISSING" || echo "CLOUDFRONT_DOMAIN is set"

      - name: �🚀 Deploy to AWS Lambda
        working-directory: ./server
        run: serverless deploy
        env:
          DB_URL: ${{ secrets.DB_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
          GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.GOOGLE_LOGIN_CLIENT_ID }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          CLOUDFRONT_PRIVATE_KEY: ${{ secrets.CLOUDFRONT_PRIVATE_KEY }}
          CLOUDFRONT_KEY_PAIR_ID: ${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          OTP_RESEND_KEY: ${{ secrets.OTP_RESEND_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: 📢 Telegram Notification (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Backend Deployment Successful!
            
            📦 Repo: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            📝 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.actor }}
            
            ✅ Service is live!

      - name: 🚨 Telegram Notification (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔴 Backend Deployment FAILED
            
            📦 Repo: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            ❌ Error: Check GitHub Actions logs.
